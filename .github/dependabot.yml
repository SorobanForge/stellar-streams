version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    # Group regular version bumps together to reduce PR noise while keeping security updates ungrouped
    groups:
      stellar-sdk:
        applies-to: version-updates
        patterns:
          - '@stellar/*'
          - '@stellar-starter-kit/*'
      dev-tooling:
        applies-to: version-updates
        patterns:
          - 'eslint*'
          - '@eslint*'
          - 'prettier*'
          - 'typescript*'
          - 'vitest*'
          - '@vitest*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'github-actions'
