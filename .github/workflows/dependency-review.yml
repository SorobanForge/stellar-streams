name: Dependency Review

# Two independent guards for new dependencies (#160):
#
#   * `review` blocks a pull request that adds a dependency with a high-severity
#     advisory (or worse), using GitHub's dependency graph.
#   * `audit` runs `pnpm audit --prod` on pull requests and weekly, because the
#     advisory database changes after a dependency lands and a scheduled run
#     catches what the PR day missed.
#
# Both jobs run on pull requests so the required status checks in
# scripts/setup-branch-protection.sh always report on a PR. The audit job never
# skips silently: a vulnerability at or above high fails it and prints the report.
on:
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, Monday 06:00 UTC. Advisories are published continuously, so this
    # catches vulnerable versions already on `main` without waiting for a bump.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Review Dependency Changes
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high and critical advisories; lower severities are reported
          # in the job log without blocking the PR.
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Production Dependencies
        # `--audit-level=high` makes the command exit non-zero only for high or
        # critical advisories, while the report still lists everything it found.
        run: pnpm audit --prod --audit-level=high
