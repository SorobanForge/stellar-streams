name: 'Secret Scan'

# Blocks accidentally committed credentials before they reach main. The scan
# covers only the pull request's own commits, so an old, already-triaged finding
# in the history does not fail every new PR.
#
# `.gitleaks.toml` keeps the default ruleset and allowlists only public Stellar
# identifiers and vendored patches. See docs/triage.md before adding to it.
#
# Never switch this to `pull_request_target`: the scan would then run untrusted
# PR code with a write token.
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan PR for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # The scan walks git history, so it needs more than the tip commit.
          fetch-depth: 0

      - name: Scan for Committed Secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null; then
            range="origin/${BASE_REF}..HEAD"
          else
            # Manual run: check the tip commit rather than the whole history.
            range="-n 1 HEAD"
          fi

          report_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$report_dir"

          # Omit --verbose and write a redacted JSON report so neither the raw
          # secret value nor surrounding line context is ever printed to stdout.
          set +e
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$report_dir:/report" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect \
            --config /repo/.gitleaks.toml \
            --source /repo \
            --log-opts="$range" \
            --redact=100 \
            --report-format json \
            --report-path /report/findings.json \
            --no-banner
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Gitleaks found no committed secrets in commit range \`$range\`." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          report_file="$report_dir/findings.json"
          if [ ! -s "$report_file" ]; then
            echo "::error::Gitleaks exited with status $status without producing a findings report."
            exit 1
          fi

          count=$(jq 'length' "$report_file")
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine // 1)::Potential secret detected by rule \"\(.RuleID)\" in commit \(.Commit[0:7]) (\(.File):\(.StartLine // 1)). Secret value omitted."' "$report_file"

          {
            echo "### Secret scan failed ($count finding(s))"
            echo ""
            echo "| File | Line | Rule | Commit |"
            echo "| :--- | ---: | :--- | :----- |"
            jq -r '.[] | "| `\(.File)` | \(.StartLine // 1) | `\(.RuleID)` | `\(.Commit[0:7])` |"' "$report_file"
            echo ""
            echo "Rotate any exposed credential immediately; rewriting branch history alone does not revoke a leaked key."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
