name: Docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: `pull_request` deliberately has no `paths:` filter. "Check Documentation
# Links" is a required status check (scripts/setup-branch-protection.sh), and a
# path-filtered workflow never reports on unrelated PRs, which would block every
# non-docs merge. The whole job is a short lychee run over the ~30 committed
# Markdown files, so it is cheap to report on every PR (#145).

jobs:
  docs:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Markdown Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --verbose './**/*.md'
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
